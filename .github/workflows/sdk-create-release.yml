name: SDK Update - Create Local Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  create-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'sdk-update-v')
    name: Create Stable Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Write release notes from PR body
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const branchName = pr.head.ref;
            const sdkVersion = branchName.replace('sdk-update-v', '');
            const body = pr.body && pr.body.trim()
              ? pr.body.trim()
              : `Portal SDK version ${sdkVersion} - Stable release`;

            fs.writeFileSync('/tmp/portal-sdk-release-notes.md', body, 'utf8');
      
      - name: Create stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          SDK_VERSION="${BRANCH_NAME#sdk-update-v}"
          
          echo "📦 Creating stable release for v${SDK_VERSION}..."
          
          mkdir -p /tmp/sdk-release
          
          rsync -av --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ /tmp/sdk-release/
          
          cd /tmp/sdk-release
          zip -r "../portal-sdk_v${SDK_VERSION}.zip" . > /dev/null
          cd -
          
          git tag "portal-sdk_v${SDK_VERSION}" || echo "Tag already exists"
          git push origin "portal-sdk_v${SDK_VERSION}" || echo "Tag push failed or already exists"
          
          gh release create "portal-sdk_v${SDK_VERSION}" \
            "/tmp/portal-sdk_v${SDK_VERSION}.zip" \
            --title "Portal SDK v${SDK_VERSION} (Release)" \
            --notes-file "/tmp/portal-sdk-release-notes.md" \
            || gh release edit "portal-sdk_v${SDK_VERSION}" \
              --title "Portal SDK v${SDK_VERSION} (Release)" \
              --notes-file "/tmp/portal-sdk-release-notes.md"
          
          echo "✅ Stable release created"
      
      - name: Close related update issue
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prUrl = pr.html_url;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sdk-update',
              per_page: 100
            });
            const relatedIssue = issues.find(issue => {
              if (issue.pull_request) {
                return false;
              }
              const body = issue.body || '';
              return body.includes(`[#${prNumber}](${prUrl})`) ||
                body.includes(`Pull Request #${prNumber}`) ||
                body.includes(`/pull/${prNumber}`);
            });

            if (!relatedIssue) {
              core.info(`No open sdk-update issue found for PR #${prNumber}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: relatedIssue.number,
              body: `Closing automatically because SDK update PR #${prNumber} was merged.`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: relatedIssue.number,
              state: 'closed',
              state_reason: 'completed'
            });

            core.info(`Closed related issue #${relatedIssue.number}.`);

      - name: Summary
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          SDK_VERSION="${BRANCH_NAME#sdk-update-v}"
          
          echo "✅ Stable Release Created"
          echo "Version: $SDK_VERSION"
          echo "Tag: portal-sdk_v${SDK_VERSION}"
          echo "PR: #${{ github.event.pull_request.number }}"
